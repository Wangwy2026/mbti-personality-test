<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评 · 发现你的性格类型</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--purple:#6366f1;
--purple-d:#818cf8;
--purple-l:#ede9fe;
--bg:#f5f3ff;
--text:#1e1b2e;
--text-l:#6b6880;
--radius:14px;
--shadow:0 2px 12px rgba(99,102,241,.08);
--shadow-lg:0 8px 32px rgba(99,102,241,.12);
--transition:all .25s ease;
}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text);line-height:1.6}
body{display:flex;justify-content:center;align-items:flex-start;padding:20px 0}
.app{width:100%;max-width:560px;margin:0 auto;padding:0 16px;position:relative}

/* —— 首页 —— */
.home{text-align:center;padding:60px 20px 40px}
.home .logo{font-size:56px;margin-bottom:16px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.home h1{font-size:28px;font-weight:800;color:var(--text);margin-bottom:8px}
.home .subtitle{font-size:15px;color:var(--text-l);margin-bottom:32px;line-height:1.7}
.home .features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.home .feature{background:#fff;border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);font-size:13px;color:#555;display:flex;align-items:center;gap:6px}
.home .feature .icon{font-size:18px}
.home .start-btn{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border:none;padding:16px 48px;border-radius:50px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(99,102,241,.35);transition:var(--transition);font-family:var(--font)}
.home .start-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(99,102,241,.45)}
.home .start-btn:active{transform:translateY(0)}
.home .disclaimer-home{margin-top:28px;font-size:12px;color:#aaa;max-width:380px;margin-left:auto;margin-right:auto}

/* —— 测试页 —— */
.quiz{padding:20px 0}
.quiz-header{margin-bottom:24px}
.quiz-header .prog-bar{width:100%;height:8px;background:#e0e0f0;border-radius:4px;overflow:hidden;margin-bottom:10px}
.quiz-header .prog-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-d));border-radius:4px;transition:width .4s ease}
.quiz-header .prog-info{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-l)}
.quiz-header .prog-info .dim-label{background:var(--purple-l);color:var(--purple);padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600}
.q-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px;margin-bottom:20px;animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.q-card .q-num{font-size:12px;color:var(--purple);font-weight:700;margin-bottom:8px;letter-spacing:1px}
.q-card .q-text{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:24px;color:var(--text)}
.q-options{display:flex;flex-direction:column;gap:12px}
.q-option{border:2px solid #e8e8f0;border-radius:12px;padding:16px 18px;font-size:15px;cursor:pointer;transition:var(--transition);background:#fff;color:#444;font-family:var(--font);text-align:left;line-height:1.5;position:relative;overflow:hidden}
.q-option:hover{border-color:var(--purple);background:var(--purple-l);transform:translateY(-1px)}
.q-option.selected{border-color:var(--purple);background:linear-gradient(135deg,var(--purple-l),#ddd6fe);font-weight:600;color:var(--purple)}
.q-option .opt-tag{position:absolute;top:8px;right:12px;font-size:11px;color:var(--purple);opacity:0;font-weight:700;transition:opacity .2s}
.q-option.selected .opt-tag{opacity:1}
.quiz-nav{display:flex;gap:12px;align-items:center;margin-top:8px}
.nav-btn{background:#fff;border:2px solid #e0e0f0;border-radius:50px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);color:var(--text-l)}
.nav-btn:hover:not(:disabled){border-color:var(--purple);color:var(--purple);background:var(--purple-l)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border:none;box-shadow:0 4px 14px rgba(99,102,241,.3)}
.nav-btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.quiz-nav .spacer{flex:1}

/* —— 结果页 —— */
.result{padding:20px 0 60px}
.result-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;margin-bottom:20px;animation:cardPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
.result-header{padding:36px 24px 20px;text-align:center;color:#fff;position:relative}
.result-header .type-code{font-size:52px;font-weight:900;letter-spacing:3px;line-height:1}
.result-header .type-name{font-size:20px;margin-top:10px;opacity:.95;font-weight:600}
.result-header .type-slogan{font-size:14px;margin-top:6px;opacity:.85}
.result-body{padding:28px 24px}
.result-body .section-title{font-size:15px;font-weight:700;color:var(--purple);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.result-body .section-title .icon{font-size:18px}
.dim-explain{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.dim-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--bg);border-radius:10px}
.dim-item .dim-letter{font-size:22px;font-weight:900;color:var(--purple);min-width:32px;text-align:center;line-height:1.2}
.dim-item .dim-info{flex:1}
.dim-item .dim-info .dim-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.dim-item .dim-info .dim-desc{font-size:12px;color:var(--text-l);line-height:1.5}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.trait-tag{background:var(--purple-l);color:var(--purple);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500}
.type-desc-full{font-size:14px;color:var(--text-l);line-height:1.8;margin-bottom:24px}
.pct-section{margin-bottom:8px}
.pct-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pct-row .pct-labels{display:flex;justify-content:space-between;width:100%;font-size:12px;font-weight:600;margin-bottom:4px}
.pct-row .pct-labels .pct-winner{color:var(--purple)}
.pct-row .pct-labels .pct-loser{color:#bbb}
.pct-bar-wrap{width:100%;height:10px;background:#eee;border-radius:5px;overflow:hidden;display:flex}
.pct-bar-l{height:100%;border-radius:5px 0 0 5px;transition:width .6s ease}
.pct-bar-r{height:100%;border-radius:0 5px 5px 0;transition:width .6s ease;background:#e0e0f0}
.result-actions{display:flex;gap:12px;margin-bottom:20px}
.result-actions .retry-btn{flex:1;background:#fff;border:2px solid var(--purple);color:var(--purple);padding:14px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font)}
.result-actions .retry-btn:hover{background:var(--purple-l)}
.result-actions .share-btn{flex:1;background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border:none;padding:14px;border-radius:50px;font-size:15px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font);box-shadow:0 4px 14px rgba(99,102,241,.3)}
.result-actions .share-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.disclaimer{background:#fff;border:2px solid #fde68a;border-radius:12px;padding:16px 18px;font-size:13px;color:#92400e;line-height:1.6;position:relative}
.disclaimer .disclaimer-title{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.disclaimer .disclaimer-title .icon{font-size:16px}

/* —— 通用动画 —— */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
[hidden]{display:none!important}

/* —— 响应式 —— */
@media(max-width:480px){
.home h1{font-size:24px}
.q-card .q-text{font-size:18px}
.q-option{font-size:14px;padding:14px 16px}
.result-header .type-code{font-size:44px}
.result-body{padding:20px 18px}
.dim-item .dim-letter{font-size:20px}
}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ========== 首页 ========== -->
<div class="home" id="home">
<div class="logo">🧩</div>
<h1>MBTI 性格测评</h1>
<p class="subtitle">20 道趣味单选题，约 3 分钟找到你的性格类型<br>了解四个字母背后的你</p>
<div class="features">
<div class="feature"><span class="icon">⚡</span>3 分钟完成</div>
<div class="feature"><span class="icon">🔒</span>隐私无忧</div>
<div class="feature"><span class="icon">📊</span>四维度解析</div>
</div>
<button class="start-btn" id="startBtn">开始测评</button>
<p class="disclaimer-home">本测评仅供娱乐和自我了解，不构成心理诊断或专业建议</p>
</div>

<!-- ========== 测试页 ========== -->
<div class="quiz" id="quiz" hidden>
<div class="quiz-header">
<div class="prog-bar"><div class="prog-fill" id="progFill" style="width:5%"></div></div>
<div class="prog-info">
<span>第 <strong id="qNum">1</strong> / 20 题</span>
<span class="dim-label" id="dimLabel">E / I</span>
</div>
</div>
<div class="q-card" id="qCard">
<div class="q-num" id="qNumLabel">Q1</div>
<div class="q-text" id="qText"></div>
<div class="q-options" id="qOptions"></div>
</div>
<div class="quiz-nav">
<button class="nav-btn" id="prevBtn">← 上一题</button>
<div class="spacer"></div>
<button class="nav-btn primary" id="nextBtn">下一题 →</button>
</div>
</div>

<!-- ========== 结果页 ========== -->
<div class="result" id="result" hidden>
<div class="result-card" id="resultCard">
<div class="result-header" id="resultHeader">
<div class="type-code" id="typeCode"></div>
<div class="type-name" id="typeName"></div>
<div class="type-slogan" id="typeSlogan"></div>
</div>
<div class="result-body">
<div class="section-title"><span class="icon">🔤</span> 四个字母的含义</div>
<div class="dim-explain" id="dimExplain"></div>
<div class="section-title"><span class="icon">✨</span> 性格特点</div>
<div class="traits" id="traits"></div>
<div class="section-title"><span class="icon">📝</span> 类型解读</div>
<div class="type-desc-full" id="typeDescFull"></div>
<div class="section-title"><span class="icon">📊</span> 维度倾向</div>
<div class="pct-section" id="pctSection"></div>
</div>
</div>
<div class="result-actions">
<button class="retry-btn" id="retryBtn">🔄 重新测评</button>
<button class="share-btn" id="shareBtn">📋 复制结果</button>
</div>
<div class="disclaimer">
<div class="disclaimer-title"><span class="icon">⚠️</span> 免责声明</div>
本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。MBTI 是一种性格分类工具，并非临床心理评估量表。如需专业心理帮助，请咨询持证心理咨询师。
</div>
</div>

</div>

<script>
// ============================================================
// 20 道测试题目 — 4 维度 × 5 题
// 维度顺序: E/I(Q1-Q5), S/N(Q6-Q10), T/F(Q11-Q15), J/P(Q16-Q20)
// 每题两个选项，A 对应前一极，B 对应后一极
// ============================================================
const QUESTIONS=[
// —— E/I 维度（外向 Extraversion / 内向 Introversion）——
{text:"周末到了，你更想怎么过？",A:"约朋友出去聚会，人越多越开心",B:"一个人宅家放松，独处是最好的充电",dim:"EI",dimLabel:"E / I"},
{text:"到了一个陌生环境，你通常？",A:"很快和身边的人聊起来，主动破冰",B:"先安静观察一会儿，等别人来找自己",dim:"EI",dimLabel:"E / I"},
{text:"遇到开心的事情，你会？",A:"第一时间发朋友圈或告诉身边的人",B:"默默在心里开心，不一定和别人说",dim:"EI",dimLabel:"E / I"},
{text:"连续社交三天后，你的状态是？",A:"越聊越有劲，感觉能量满满",B:"有点累了，需要一个人待着恢复",dim:"EI",dimLabel:"E / I"},
{text:"你觉得哪种描述更像你？",A:"想说什么就说什么，心里藏不住话",B:"想好了再说，不轻易表露想法",dim:"EI",dimLabel:"E / I"},
// —— S/N 维度（感觉 Sensing / 直觉 Intuition）——
{text:"读一本书或看一部电影，你更关注？",A:"故事情节是否合理、细节是否扎实",B:"故事背后的主题和深层含义",dim:"SN",dimLabel:"S / N"},
{text:"面对一个新问题，你更倾向？",A:"用已有的经验和靠谱的方法来解决",B:"跳出框架，尝试一个全新的思路",dim:"SN",dimLabel:"S / N"},
{text:"别人给你讲一件事，你更在意？",A:"他说了什么具体的事实和信息",B:"他说话时的感受和言外之意",dim:"SN",dimLabel:"S / N"},
{text:"你更喜欢的旅行方式是？",A:"做好详细攻略，按计划逐个打卡",B:"随性而行，路上遇到什么就看什么",dim:"SN",dimLabel:"S / N"},
{text:"你更认同哪种说法？",A:"脚踏实地，一步一个脚印最重要",B:"敢想敢做梦，有愿景才能走得远",dim:"SN",dimLabel:"S / N"},
// —— T/F 维度（思考 Thinking / 情感 Feeling）——
{text:"朋友跟你倒苦水，你的第一反应是？",A:"帮他分析问题出在哪、该怎么解决",B:"先安慰他、陪他吐槽，情绪优先",dim:"TF",dimLabel:"T / F"},
{text:"做一个重要决定时，你更依赖？",A:"逻辑分析利弊，理性权衡后做选择",B:"内心感受和直觉，觉得对就去做",dim:"TF",dimLabel:"T / F"},
{text:"看到新闻里有人遭遇不幸，你首先？",A:"思考是什么原因导致了这个问题",B:"先感到心疼和难过，希望他没事",dim:"TF",dimLabel:"T / F"},
{text:"和别人意见不合时，你更倾向？",A:"就事论事，对就是对，错就是错",B:"维护关系更重要，求同存异",dim:"TF",dimLabel:"T / F"},
{text:"你觉得哪种品质更重要？",A:"公平公正，一视同仁",B:"善良温暖，懂得体谅他人",dim:"TF",dimLabel:"T / F"},
// —— J/P 维度（判断 Judging / 感知 Perceiving）——
{text:"你的书桌或工作台通常什么样？",A:"整整齐齐，东西都有固定的位置",B:"看起来有点乱，但我自己知道东西在哪",dim:"JP",dimLabel:"J / P"},
{text:"面对一个截止日期，你的节奏是？",A:"提前做好，最后一天淡定交差",B:"不到最后一刻没动力，冲刺完成",dim:"JP",dimLabel:"J / P"},
{text:"出去旅行，你更喜欢？",A:"提前订好机票酒店和行程表",B:"走一步看一步，保持灵活和开放",dim:"JP",dimLabel:"J / P"},
{text:"你的待办清单是什么样的？",A:"列好打勾，完成一项划掉一项很爽",B:"列了但不太看，想起来就做",dim:"JP",dimLabel:"J / P"},
{text:"你更认同哪种生活态度？",A:"有计划有节奏，掌控感让我安心",B:"保持开放和弹性，随时拥抱变化",dim:"JP",dimLabel:"J / P"}
];

// ============================================================
// 四维度字母含义解释
// ============================================================
const DIM_INFO={
E:{name:"E — 外向（Extraversion）",desc:"你的能量来自外部世界。你喜欢和人交流、参与活动，在社交中获得活力。倾向于先行动再思考，边做边说。"},
I:{name:"I — 内向（Introversion）",desc:"你的能量来自内心世界。你享受独处和深度思考，在安静的环境中充电。倾向于先想好再说，三思而后行。"},
S:{name:"S — 感觉（Sensing）",desc:"你关注当下的事实和细节，相信亲眼所见、亲身所历。喜欢用经验和已有的方法做事，脚踏实地，注重实际。"},
N:{name:"N — 直觉（Intuition）",desc:"你关注未来的可能性和背后的含义，喜欢跳出框架思考。富有想象力和创造力，对新颖的想法和理论充满好奇。"},
T:{name:"T — 思考（Thinking）",desc:"你做决定时以逻辑和客观分析为导向。重视公平、效率和原则，擅长发现问题和解决问题，不轻易被情绪左右。"},
F:{name:"F — 情感（Feeling）",desc:"你做决定时以个人价值观和他人感受为导向。重视和谐、同理心和人际关系，善于体谅他人，注重情感联结。"},
J:{name:"J — 判断（Judging）",desc:"你喜欢有计划、有结构的生活。提前安排、按部就班让你感到安心。目标明确，喜欢把事情定下来再推进。"},
P:{name:"P — 感知（Perceiving）",desc:"你喜欢灵活、开放的生活方式。保持选择的弹性，随时适应新情况。不喜欢被条条框框束缚，享受探索的过程。"}
};

// ============================================================
// 16 种 MBTI 类型数据
// ============================================================
const TYPES={
INTJ:{name:"建筑师",slogan:"独立而富有想象力的战略家",color:"#3b5998",color2:"#4e6ca8",desc:"你天生善于长线思考和战略规划，脑子里经常在推演多种可能性。独立、果断，对知识有强烈的渴望，比起被理解更在意把事情做对。你擅长在复杂局面中找到关键路径，但有时会显得过于理性和冷淡。",traits:["战略思维","独立自主","追求完美","善于规划"]},
INTP:{name:"逻辑学家",slogan:"充满好奇心的发明家",color:"#4a6fa5",color2:"#5b7fb5",desc:"你对万事万物背后的原理充满好奇，喜欢拆解和重建想法。思考是你的天性，社交是耗电的，沉浸在问题中是充电的。你善于发现逻辑漏洞，但有时会因为想得太多而迟迟不行动。",traits:["逻辑缜密","好奇心强","善于分析","独立思考"]},
ENTJ:{name:"指挥官",slogan:"大胆而果断的领导者",color:"#c0392b",color2:"#d4453a",desc:"你天生具有领导力，执行力拉满。看到混乱就想整理，看到机会就想抓住。说话直来直去，做事雷厉风行，有时会显得强势，但跟着你通常方向不会错。你最大的挑战是学会倾听和放慢脚步。",traits:["领导力强","果断高效","目标导向","天生C位"]},

// ============================================================
// 状态
// ============================================================
let currentQ=0;
let answers=new Array(20).fill(null);

// ============================================================
// 页面切换
// ============================================================
function showPage(id){
['home','quiz','result'].forEach(p=>{
const el=document.getElementById(p);
if(p===id){el.hidden=false;el.classList.add('fade-in');}
else{el.hidden=true;el.classList.remove('fade-in');}
});
}

// ============================================================
// 开始
// ============================================================
document.getElementById('startBtn').addEventListener('click',()=>{
currentQ=0;
answers.fill(null);
showPage('quiz');
renderQuestion();
});

// ============================================================
// 渲染题目
// ============================================================
function renderQuestion(){
const q=QUESTIONS[currentQ];
const pct=((currentQ)/20)*100;
document.getElementById('progFill').style.width=Math.max(pct,5)+'%';
document.getElementById('qNum').textContent=currentQ+1;
document.getElementById('dimLabel').textContent=q.dimLabel;
const card=document.getElementById('qCard');
card.style.animation='none';
void card.offsetWidth;
card.style.animation='slideIn .35s ease';
document.getElementById('qNumLabel').textContent='Q'+(currentQ+1);
document.getElementById('qText').textContent=q.text;
const opts=document.getElementById('qOptions');
const sel=answers[currentQ];
opts.innerHTML=
'<button class="q-option'+(sel==='A'?' selected':'')+'" data-pick="A"><span class="opt-tag">A</span>'+q.A+'</button>'+
'<button class="q-option'+(sel==='B'?' selected':'')+'" data-pick="B"><span class="opt-tag">B</span>'+q.B+'</button>';
opts.querySelectorAll('.q-option').forEach(btn=>{
btn.addEventListener('click',()=>{
const pick=btn.dataset.pick;
answers[currentQ]=pick;
opts.querySelectorAll('.q-option').forEach(b=>b.classList.remove('selected'));
btn.classList.add('selected');
// 更新进度条
const newPct=((currentQ+1)/20)*100;
document.getElementById('progFill').style.width=newPct+'%';
// 如果不是最后一题，延迟后自动跳下一题
if(currentQ<19){
setTimeout(()=>{currentQ++;renderQuestion();},350);
}
});
});
// 按钮状态
document.getElementById('prevBtn').disabled=(currentQ===0);
const nextBtn=document.getElementById('nextBtn');
if(currentQ===19){
nextBtn.textContent='查看结果 →';
nextBtn.disabled=!answers[currentQ];
}else{
nextBtn.textContent='下一题 →';
nextBtn.disabled=!answers[currentQ];
}
}

// 上一题
document.getElementById('prevBtn').addEventListener('click',()=>{
if(currentQ>0){currentQ--;renderQuestion();}
});

// 下一题
document.getElementById('nextBtn').addEventListener('click',()=>{
if(!answers[currentQ])return;
if(currentQ<19){currentQ++;renderQuestion();}
else{showResult();}
});

// ============================================================
// 计分
// ============================================================
function calcResult(){
const dimScore={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
for(let i=0;i<20;i++){
if(!answers[i])continue;
const q=QUESTIONS[i];
// A 对应 dim 的第一个字母, B 对应第二个
const poleA=q.dim[0]; // E, S, T, J
const poleB=q.dim[1]; // I, N, F, P
if(answers[i]==='A')dimScore[poleA]++;
else dimScore[poleB]++;
}
const dimPairs=[["E","I"],["S","N"],["T","F"],["J","P"]];
let type="";
const pcts=[];
dimPairs.forEach(([a,b])=>{
const total=dimScore[a]+dimScore[b]||1;
const pa=Math.round((dimScore[a]/total)*100);
const pb=100-pa;
const winner=dimScore[a]>=dimScore[b]?a:b;
type+=winner;
pcts.push({a,b,pa,pb,winner});
});
return{type,pcts};
}

// ============================================================
// 展示结果
// ============================================================
function showResult(){
document.getElementById('progFill').style.width='100%';
const{type,pcts}=calcResult();
const t=TYPES[type];
// 头部
const header=document.getElementById('resultHeader');
header.style.background='linear-gradient(135deg,'+t.color+','+t.color2+')';
document.getElementById('typeCode').textContent=type;
document.getElementById('typeName').textContent=t.name;
document.getElementById('typeSlogan').textContent=t.slogan;
// 四字母含义
const dimExplain=document.getElementById('dimExplain');
const dimHtml=type.split('').map(letter=>{
const info=DIM_INFO[letter];
return '<div class="dim-item">'+
'<div class="dim-letter">'+letter+'</div>'+
'<div class="dim-info">'+
'<div class="dim-name">'+info.name+'</div>'+
'<div class="dim-desc">'+info.desc+'</div>'+
'</div></div>';
}).join('');
dimExplain.innerHTML=dimHtml;
// 特点标签
document.getElementById('traits').innerHTML=t.traits.map(tag=>'<span class="trait-tag">'+tag+'</span>').join('');
// 类型解读
document.getElementById('typeDescFull').textContent=t.desc;
// 维度倾向
const pctHtml=pcts.map(p=>{
const winnerSide=p.a===p.winner;
return '<div class="pct-row">'+
'<div style="width:100%">'+
'<div class="pct-labels">'+
'<span class="'+(winnerSide?'pct-winner':'pct-loser')+'">'+p.a+' '+p.pa+'%</span>'+
'<span class="'+(!winnerSide?'pct-winner':'pct-loser')+'">'+p.pb+'% '+p.b+'</span>'+
'</div>'+
'<div class="pct-bar-wrap">'+
'<div class="pct-bar-l" style="width:'+p.pa+'%;background:'+(winnerSide?t.color:'#e0e0f0')+'"></div>'+
'<div class="pct-bar-r" style="width:'+p.pb+'%;background:'+(!winnerSide?t.color:'#e0e0f0')+'"></div>'+
'</div>'+
'</div></div>';
}).join('');
document.getElementById('pctSection').innerHTML=pctHtml;
showPage('result');
}

// ============================================================
// 重新测评
// ============================================================
document.getElementById('retryBtn').addEventListener('click',()=>{
currentQ=0;
answers.fill(null);
showPage('home');
});

// ============================================================
// 复制结果
// ============================================================
document.getElementById('shareBtn').addEventListener('click',()=>{
const type=document.getElementById('typeCode').textContent;
const name=document.getElementById('typeName').textContent;
const slogan=document.getElementById('typeSlogan').textContent;
const text='我是 '+type+' '+name+'「'+slogan+'」——你的性格类型是什么？来做 MBTI 性格测评吧！';
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(()=>{
showToast('结果已复制到剪贴板');
}).catch(()=>{
showToast('复制失败，请手动复制');
});
}else{
// fallback
const ta=document.createElement('textarea');
ta.value=text;
document.body.appendChild(ta);
ta.select();
try{document.execCommand('copy');showToast('结果已复制到剪贴板');}catch(e){showToast('复制失败，请手动复制');}
document.body.removeChild(ta);
}
});

function showToast(msg){
let toast=document.getElementById('toast');
if(!toast){
toast=document.createElement('div');
toast.id='toast';
toast.style.cssText='position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 24px;border-radius:50px;font-size:14px;z-index:9999;transition:opacity .3s;font-family:var(--font)';
document.body.appendChild(toast);
}
toast.textContent=msg;
toast.style.opacity='1';
clearTimeout(toast._timer);
toast._timer=setTimeout(()=>{toast.style.opacity='0';},2000);
}

// 初始化
showPage('home');
</script>

</html>
